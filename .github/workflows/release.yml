name: Build Release

# Releases one package from the Packages folder. Pick it when running the workflow.
# The version comes from that package's package.json, and the release is tagged "<package>-<version>"
# so several packages can share this repository.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - com.livedimensions.vpmpackagesync
          - com.livedimensions.udonsharpfastbuild

jobs:

  # Build and release the Package
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packageName: ${{ inputs.package }}
      packagePath: Packages/${{ inputs.package }}
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      # Make sure the package exists and its package.json is for that package
      - name: Validate Package
        run: |
          if [ ! -f "${{ env.packagePath }}/package.json" ]; then
            echo "::error::${{ env.packagePath }}/package.json doesn't exist."
            exit 1
          fi
          name=$(jq -r .name "${{ env.packagePath }}/package.json")
          if [ "$name" != "${{ env.packageName }}" ]; then
            echo "::error::${{ env.packagePath }}/package.json is named '$name', expected '${{ env.packageName }}'."
            exit 1
          fi

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with:
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"

      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ env.packageName }}-${{ steps.version.outputs.value }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ env.packageName }}-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV
          echo "tag=${{ env.packageName }}-${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      # Refuse to release a version that was already released (bump the version in package.json first)
      - name: Check Tag
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${{ env.tag }}" > /dev/null; then
            echo "::error::${{ env.tag }} was already released. Bump the version in ${{ env.packagePath }}/package.json."
            exit 1
          fi

      # Zip the Package for release
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .

      # Build a list of .meta files for future use
      - name: Track Package Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta >> metaList

      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList

      # Make a release tag for this package and version
      - name: Create Tag
        id: tag_version
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ env.tag }}"

      # Publish the Release to GitHub
      - name: Make Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          name: "${{ env.packageName }} ${{ env.version }}"
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ env.tag }}
